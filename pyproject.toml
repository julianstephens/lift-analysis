[project]
name = "lift-analysis"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
analysis = { workspace = true }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["W", "E", "F", "N", "B", "RET", "SIM", "G", "TRY", "LOG", "RUF", "I"]
