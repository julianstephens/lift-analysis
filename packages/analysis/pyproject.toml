[project]
name = "analysis"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Julian Stephens", email = "julian@julianstephens.net" }]
requires-python = "==3.14.*"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "rich>=15.0.0",
]

[project.scripts]
analyze = "analysis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]
